[project]
name = "roomcast"
version = "0.1.0"
description = "A local, bounded streaming relay and Roku controller"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4", "playwright>=1.55,<2", "mcp>=1.20,<2"]

[project.scripts]
roomcast = "roomcast.cli:main"
roomcast-service = "roomcast.server:main"
roomcast-mcp = "roomcast.mcp:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roomcast*"]

[dependency-groups]
dev = [
    "ruff==0.15.17",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
